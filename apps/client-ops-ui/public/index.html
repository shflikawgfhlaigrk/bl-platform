<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050504" />
    <meta name="description" content="Black Label Client Operations command center." />
    <link rel="icon" href="./icons/brand-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./app.css" />
    <title>Black Label Client Operations</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <div class="app-shell" id="app-shell">
      <aside class="nav-rail" id="nav-rail" aria-label="Primary navigation">
        <a class="brand" href="#/overview" aria-label="Black Label Client Operations home">
          <span class="brand-mark" aria-hidden="true">BL</span>
          <span class="brand-copy">
            <span class="brand-name">Black Label</span>
            <span class="brand-suite">Client Operations</span>
          </span>
        </a>
        <nav class="primary-nav" aria-label="Operator console">
          <ul id="nav-list"></ul>
        </nav>
        <div class="nav-footer">
          <button class="nav-collapse" id="nav-collapse" type="button" aria-label="Collapse navigation" aria-pressed="false">
            <span class="icon-slot" data-icon="collapse" aria-hidden="true"></span>
            <span class="nav-label">Collapse</span>
          </button>
        </div>
      </aside>

      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="nav-rail">
          <span class="icon-slot" data-icon="menu" aria-hidden="true"></span>
        </button>
        <div class="client-context">
          <span class="utility-label">Client</span>
          <button class="client-name client-switcher" id="client-name" type="button" aria-label="Set client tenant context">Client workspace</button>
        </div>
        <div class="topbar-spacer"></div>
        <div class="api-state" id="api-state" role="status" aria-live="polite">
          <span class="status-dot is-neutral" aria-hidden="true"></span>
          <span>Checking API</span>
        </div>
        <div class="topbar-divider" aria-hidden="true"></div>
        <div class="utility-stat">
          <span class="utility-label">Execution cost (MTD)</span>
          <strong id="execution-cost">—</strong>
        </div>
        <button class="profile-button" type="button" aria-label="Operator profile">BL</button>
      </header>

      <main id="main" class="workspace" tabindex="-1">
        <div id="view-root" class="view-root" aria-live="polite"></div>
      </main>

      <aside id="detail-drawer" class="detail-drawer" aria-label="Details" aria-hidden="true">
        <div class="drawer-header">
          <div>
            <span class="drawer-context" id="drawer-context">Details</span>
            <h2 id="drawer-title">Selection</h2>
          </div>
          <button class="icon-button" id="drawer-close" type="button" aria-label="Close details">
            <span class="icon-slot" data-icon="close" aria-hidden="true"></span>
          </button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
        <div class="drawer-actions" id="drawer-actions" hidden></div>
      </aside>

      <button class="scrim" id="scrim" type="button" aria-label="Close navigation or details" tabindex="-1"></button>
      <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
    </div>

    <noscript><p class="noscript">JavaScript is required to run Client Operations.</p></noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
