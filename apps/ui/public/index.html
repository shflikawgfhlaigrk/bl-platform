<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f54" />
    <meta name="description" content="Mags Commerce OS — your whole business on this computer." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="./app.css" />
    <title>Mags Commerce OS</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <form id="identity-form">
      <h1>Sign in to your workspace</h1>
      <label>One-hour access credential <input id="identity-token" type="password" autocomplete="off" required></label>
      <button type="submit">Sign in</button>
      <p id="identity-status">Use the private credential file issued for your user and workspace.</p>
    </form>
    <button id="identity-logout" hidden>Sign out of this tab</button>
    <div id="app-shell" class="shell" hidden>
      <!-- Header / banner -->
      <header class="app-header" role="banner">
        <button
          id="nav-toggle"
          class="icon-btn nav-toggle"
          aria-label="Show or hide navigation"
          aria-expanded="false"
          aria-controls="app-nav"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">🐴</span>
          <span class="brand-name" id="tenant-name">Mags Commerce OS</span>
        </div>
        <div class="header-meta">
          <span id="data-as-of" class="data-as-of" title="The date of the newest data loaded">Data as of —</span>
          <button
            id="sync-indicator"
            class="sync-indicator sync-synced"
            type="button"
            aria-live="polite"
            title="Sync status. Click to retry any failed items."
          >
            <span class="sync-dot" aria-hidden="true"></span>
            <span id="sync-text">Synced</span>
          </button>
          <span id="current-user" class="current-user" title="Signed-in user">Owner</span>
        </div>
      </header>

      <!-- Left navigation -->
      <nav id="app-nav" class="app-nav" aria-label="Sections">
        <ul id="nav-list" class="nav-list"><!-- populated by app.js --></ul>
        <div class="nav-footer">
          <span class="nav-mode" id="offline-badge" hidden>● Offline — changes are being saved on this device</span>
        </div>
      </nav>

      <!-- Main content -->
      <main id="main" class="app-main" tabindex="-1">
        <div id="view-root" class="view-root" aria-live="polite">
          <div class="loading">Loading…</div>
        </div>
      </main>

      <!-- Live region for toasts / scan feedback (screen-reader) -->
      <div id="live-region" class="visually-hidden" role="status" aria-live="assertive"></div>
      <div id="toast-root" class="toast-root" aria-hidden="false"></div>
      <div id="scan-flash" class="scan-flash" aria-hidden="true"></div>
    </div>

    <noscript>
      <p style="padding:1rem">Mags Commerce OS needs JavaScript enabled to run. It stays entirely on this computer.</p>
    </noscript>

    <script type="module" src="./js/identity-ui.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
